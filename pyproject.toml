[project]
name = "thoth"
version = "0.1.0"
description = "Minimal persistent-agent engine — episodic memory CLI and composable skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
thoth-mem = "thoth_mem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thoth_mem"]
