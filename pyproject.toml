[project]
name = "thoth"
version = "0.2.0"
description = "Minimal persistent-agent engine — episodic memory and to-do list CLIs plus composable skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
thoth-mem = "thoth_mem.cli:main"
todo-list = "todo_list.cli:main"
health-track = "health_track.cli:main"
harness-route = "harness_route.cli:main"
auto-commit = "auto_commit.cli:main"
thread-plan = "thread_plan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thoth_core", "src/thoth_mem", "src/todo_list", "src/health_track", "src/harness_route", "src/auto_commit", "src/thread_plan"]
